[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-reservoir"
version = "1.0.1"
description = "Reservoir computing on fruit fly connectomes (male CNS, replicated on FlyWire), tested against random-wiring controls on market data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milan Kalajdzic" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12",
    "matplotlib>=3.7",
    "pillow>=9.1",
    "pyyaml>=6",
    "joblib>=1.3",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ipykernel", "nbformat", "nbclient"]
# GPU: no extra here on purpose. PyPI's torch is the NVIDIA build; AMD cards need the ROCm build
# from PyTorch's own index (see "GPU (AMD on Linux)" in the README).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
